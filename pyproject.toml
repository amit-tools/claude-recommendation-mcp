[project]
name = "claude-recommendation-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.2.0",
    "mysql-connector-python>=26.7.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
claude-recommendation-mcp = "claude_recommendation_mcp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
